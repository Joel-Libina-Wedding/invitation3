<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1024" />
  <title>Joel & Libina | Save the Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing-page">
  <main class="landing-shell">
    <div class="floating-petals" aria-hidden="true">
      <span>✦</span><span>✧</span><span>❤</span><span>✦</span><span>✧</span>
    </div>

    <section class="invite-card landing-card">
      <div class="save-title">
        <div class="save-row"><span>SAVE</span></div>
        <div class="save-row second"><em>the</em><span>DATE</span></div>
        <div class="title-divider"><span></span><b>♥</b><span></span></div>
      </div>

      <div class="portrait-pair">
        <figure class="mini-portrait">
          <img src="assets/images/libina.jpg" alt="Libina Mary Lalu" />
        </figure>
        <div class="amp-small">&</div>
        <figure class="mini-portrait">
          <img src="assets/images/joel.jpg" alt="Joel Mathew Philip" />
        </figure>
      </div>

      <h1 class="landing-names">Libina <span>&</span> Joel</h1>

      <div class="event-copy">
        <p class="eyebrow">WEDDING</p>
        <p class="event-date">Sunday, 3 January 2027</p>
        <div class="event-block">
          <p class="eyebrow">CEREMONY</p>
          <p>11:00 AM IST</p>
        </div>
        <div class="event-block church-block">
          <p class="eyebrow">VENUE</p>
          <p>Mar Lazarus Orthodox Valiyapally</p>
          <p class="subtle">Pathanapuram, Kerala</p>
        </div>
      </div>

      <a class="primary-button" href="invitation.html">View Invitation <span>♥</span></a>
      <p class="card-footnote">A love story worth celebrating — your invitation is inside ✧</p>
    </section>
  </main>
</body>
</html>
